<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEXANEXA</title>
  <link rel="stylesheet" href="index.css">
<style>
  .login-link {
    position: fixed;
    top: 10px;
    right: 165px;

    padding: 12px 28px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #2563eb;
    border-radius: 10px;
    box-shadow: 0 4px 12px #2563eb55;
    transition: 0.3s;
    z-index: 9999;
  }

  .login-link:hover {
    background: white;
    color: #2563eb;
    transform: translateY(-2px);
  }
</style>



</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">LEXA<span>NEXA</span></a>
  <a href="login.html" class="login-link" id="loginLink">Login</a>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>

    <button id="cart-btn" type="button">
      🛒 Cart (<span id="cart-count">0</span>)
    </button>
  
<div class="account-area" id="accountArea" hidden>
  <button id="profileButton" type="button">
    <img id="profileAvatar" alt="Profile picture"
      src="https://placehold.co/45x45?text=Me">
    <span id="profileName">My Account</span> ▾
  </button>

  <div id="accountMenu" hidden>
    <p id="profileEmail"></p>

    <label for="avatarUpload">Profile picture</label>
    <input type="file" id="avatarUpload" accept="image/*">

    <label for="fullName">Your name</label>
    <input id="fullName" type="text" placeholder="Enter your name">
    <button id="saveProfile" type="button">Save Profile</button>

    <label for="newPassword">New password</label>
    <input id="newPassword" type="password"
      minlength="6" placeholder="New password">
    <button id="changePassword" type="button">
      Change Password
    </button>

    <button id="logoutButton" type="button">Logout</button>
    <p id="accountMessage" role="status"></p>
  </div>
</div>

  </header>

  <main>
    <section id="home" class="hero">
      <div>
        <p class="tagline">YOUR STYLE, YOUR STORE</p>
        <h1>LUXANEXA</h1>
        <p>Explore products you'll love at prices you'll enjoy.</p>
        <a class="shop-btn" href="#products">Shop Now →</a>
      </div>
    </section>

    <section id="products" class="products-section">
      <p class="tagline">OUR COLLECTION</p>
      <h2>Featured Products</h2>
      <div id="product-list" class="product-grid"></div>
    </section>

    <section id="contact" class="contact-section">
      <h2>Stay Connected</h2>
      <p>More exciting products are coming soon.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>
  
  <script src="java.java"></script>
</body>
</html>
